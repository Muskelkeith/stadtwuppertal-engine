# ── Radar: Wer bekommt gerade Aufmerksamkeit? (einmal täglich, nur lesend) ──
# Vorbilder: werden alle 3 Tage genau studiert (was läuft, Ton, Themen, Formate) – Muster übernehmen, nie Texte.
vorbilder: [talzeit.wuppertal, wuppertal.aktuell]

# Resonanz: Was kommt in Wuppertal gerade gut an? Alle 6 Stunden werden diese Accounts (plus alle Instagram-Quellen
# und alle selbst entdeckten lokalen Accounts) durchgesehen. Posts, die deutlich besser laufen als beim Account üblich,
# werden zu Themen-Kandidaten. Falsche Namen merkt die Engine selbst und lässt sie weg.
resonanz: [lochlochlochlochlochloch]     # plus alle Accounts aus data/folgen.txt

radar: [wuppertal.aktuell, talzeit.wuppertal, radiowuppertal, bergischeblaulichtnews, wuppertal, stadt_wuppertal]
# Nur für Ton, Sprache und Captions (siehe data/sprache.md) – nie Themenquelle, nie im Radar
sprachvorbilder: [1live, wdrcosmo, deutschlandfunknova]
# Abstand halten (36 h, eigene Formulierung) gilt nur hier. Wuppertal Aktuell dürfen wir offen als Themenquelle nutzen.
abstand: [talzeit.wuppertal]
