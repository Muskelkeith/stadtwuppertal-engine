# ─────────────────────────────────────────────────────────────
#  @stadtwuppertal · Engine v3 · Einstellungen
#  Zugangsdaten stehen NICHT hier, sondern im GitHub-Secret ENGINE_SECRETS.
# ─────────────────────────────────────────────────────────────
account:
  handle: stadtwuppertal
  graph_api_version: v25.0
  meta_app_id: "2581690732299634"   # App „stadtwuppertal engine“
claim: "Ein Tal, ein Fluss, ein Schwebebus."
timezone: Europe/Berlin

# ── Takt ────────────────────────────────────────────────────
takt:
  active_hours: [6, 23]          # nur in dieser Zeit wird gepostet
  collect_every_min: 10          # so oft werden alle Quellen abgeklappert (jeder Takt)
  slots:                         # feste Sendeplätze (wenn nichts Eiliges anliegt)
    "07:30": morgen
    "12:30": mittag
    "18:30": abend
  rotation:                      # was im Slot läuft, wenn keine starke Nachricht da ist
    morgen: news
    mittag: {mo: warum, di: kurios, mi: damals, do: frag, fr: spotlight, sa: platt, so: history}
    abend:  {mo: spotlight, di: warum, mi: fact, do: events, fr: events, sa: damals, so: frag}
  reel_slot: "19:45"             # einmal am Tag: Reel aus dem besten Karussell
  report_at: "21:30"             # Tagesbericht per Telegram
  max_feed_per_day: 5            # Eilmeldungen zählen mit, dürfen die Grenze aber reißen
  vorrat: 2                      # so viele fertige Posts liegen immer auf Halde (für „jetzt“ und leere Sendeplätze)
  min_gap_min: 90                # Mindestabstand zwischen zwei Feed-Posts (außer Eilmeldung)
  breaking_score: 8              # ab dieser Bewertung geht eine Meldung sofort raus
  followup_after_h: 4            # Nachdreh (Einordnung, Quiz, Frage) so viele Stunden nach der Meldung
  freigabe_tage: 4               # Probephase: so viele Tage braucht jeder Post dein „Passt“ (0 = aus)
  approval_timeout_min: 60       # Nachrichten ohne deinen Tipp gehen danach mit KI-Hinweis raus
  learn_after_days: 5            # alle 5 Tage Auswertung (Formate, Uhrzeiten) → Kurs für die nächsten Tage

wagnis_rate: 0.12

# ── Bildredaktion & Bild-Anfragen ──────────────────────────
photos:
  hashtags: [meinwuppertal, wuppertal, schwebebahn, elberfeld]   # max. 30 verschiedene pro Woche (Meta)
  hashtag_every_min: 120
  rate_per_run: 4              # so viele Top-Kandidaten pro Lauf schaut sich die Bildredaktion an
  community_min: 8.0           # ab dieser Note lohnt eine Anfrage bzw. ein Community-Post
  autopost_min: null           # fremde Fotos nie ohne dein „passt“ (z. B. 9.0 = sehr starke gehen nach 3 h allein raus)
  news_min: 6.5                # Bild zu einer Meldung: klar und vertretbar reicht
  max_requests_per_day: 3      # mehr Anfragen pro Tag mutet dir die Engine nicht zu
  ask_again_days: 60                # Anteil gestalterischer Ausreißer (andere Farbpaare)

llm:
  triage: haiku                  # sichten: schnell und sparsam
  write: sonnet                  # Themen prüfen, Nachrichten verstehen, Kommentare
  redaktion: opus                # Posts schreiben und Endkontrolle – hier entscheidet sich die Qualität
  code: opus                     # Werkstatt: Code reparieren (fällt sonst auf sonnet zurück)

voice:
  always_hashtags: [wuppertal]

# ── Nachrichten-Quellen ─────────────────────────────────────
news:
  lookback_hours: 14
  relevance_keywords: [Wuppertal, Elberfeld, Barmen, Vohwinkel, Cronenberg, Ronsdorf, Langerfeld, Beyenburg,
                       Oberbarmen, Heckinghausen, Uellendahl, Katernberg, Schwebebahn, WSW, WSV, Döppersberg,
                       Nordbahntrasse, Ölberg, Arrenberg, Luisenviertel, Mirke, Bergisch]
  dwd_warnings: {enabled: true, warncell_id: "105124000", min_level: 2}

# type: rss (url ODER homepage mit Auto-Erkennung) | instagram (handle, offizielle Schnittstelle)
