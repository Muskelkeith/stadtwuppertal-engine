#   (Freigaben, die du per Telegram-Knopf „freigabe da“ gibst, merkt sich die Engine selbst – hier nichts eintragen nötig.)
#   Bildnetzwerk wie bei Wuppertal Aktuell: lokale Fotografen fragen, dann z. B.
#   - {name: Fotograf X, type: instagram, handle: HANDLE, filter_wuppertal: false, bilder: freigabe}
