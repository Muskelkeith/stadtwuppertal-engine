    schild: "orange day"
    slides:
      - head: "so geht's"
        body: "1. Handfläche zeigen. 2. Daumen in die Handfläche klappen. 3. Die Finger über den Daumen schließen. Das „Signal for Help“ hat die Canadian Women's Foundation 2020 entwickelt, damit Frauen in Videoanrufen still um Hilfe bitten können. Es funktioniert genauso im Bus, im Laden oder auf der Straße."
      - head: "und wenn ich es sehe?"
        body: "Ruhig bleiben, nicht auffällig reagieren. Bei akuter Gefahr sofort 110 wählen. Wer unsicher ist, was zu tun ist, kann sich beim Hilfetelefon beraten lassen – das geht ausdrücklich auch für Freundinnen, Familie, Nachbarn und Kolleg:innen."
      - head: "warum heute?"
        body: "Seit 1981 ist der 25. November Gedenktag gegen Gewalt an Frauen, seit 1999 von den Vereinten Nationen anerkannt. Bis zum 10. Dezember läuft die Kampagne „Orange the World“. Jede dritte Frau in Deutschland erlebt mindestens einmal im Leben körperliche oder sexualisierte Gewalt."
      - head: "sofort hilfe?"
        body: "Akute Gefahr: 110. Hilfetelefon „Gewalt gegen Frauen“: 116 016 – rund um die Uhr, kostenlos, anonym, mit Dolmetscherinnen in 18 Sprachen. Auf hilfetelefon.de gibt es außerdem einen Chat (Sofort-Chat täglich 12 bis 20 Uhr) und Infos in Leichter Sprache. Gehörlose und schwerhörige Frauen erreichen das Hilfetelefon in Gebärdensprache über den Tess-Relay-Dienst."
      - head: "hier im tal"
        body: "Frauenhaus Wuppertal (Frauen helfen Frauen): 0202 71 14 26, Tag und Nacht. Beratungsstelle Frauen helfen Frauen: 0202 31 88 55 – bei häuslicher Gewalt und Stalking. FrauenBeratung + Selbsthilfe, Laurentiusstraße 12 in Elberfeld: 0202 30 60 07 – auch bei sexualisierter Gewalt und Belästigung am Arbeitsplatz."
    caption: "Heute ist Orange Day, der internationale Tag gegen Gewalt an Frauen.\nDieses Handzeichen sollten alle kennen: Handfläche zeigen, Daumen einklappen, Finger darüber schließen. Wer es sieht, weiß: Diese Person braucht Hilfe.\nAlle Nummern für Wuppertal stehen in den Slides. Speichern und weiterschicken – man weiß nie, wer sie gerade braucht."
