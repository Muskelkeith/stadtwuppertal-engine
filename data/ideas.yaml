- id: fact-01
  type: fact
  big: '517'
  text: Treppen gibt es im Wuppertaler Stadtgebiet, 352 davon gehören zum städtischen Wegenetz.
  source: https://de.statista.com/infografik/22711/staedte-in-zahlen-wuppertal
  status: geprueft
- id: fact-02
  type: fact
  big: '103'
  text: Stufen hat das Tippen-Tappen-Tönchen vom Luisenviertel hoch zum Ölberg, 16 Meter Höhenunterschied.
  source: https://www.ich-geh-wandern.de/luisenviertel-wuppertal
  status: geprueft
- id: fact-03
  type: fact
  big: 198 m
  text: hoch ist der Kamin des Heizkraftwerks Elberfeld, das höchste Bauwerk der Stadt.
  source: https://schwebebahn.de/cms/uploads/wsw_von_station_zu_station_50f90f2919.pdf
  status: geprueft
- id: fact-04
  type: fact
  big: '85.000'
  text: Fahrgäste nutzen die Schwebebahn an einem normalen Tag.
  source: https://de.statista.com/infografik/amp/22711/staedte-in-zahlen-wuppertal/
  status: geprueft
- id: fact-05
  type: fact
  big: 1.600 m²
  text: groß ist der Tiefbunker unter dem Döppersberg, den die Stadt verkauft hat.
  source: https://www.wuppertal.de/microsite/doeppersberg/medien/bindata/Journal02_2016_web.pdf
  status: geprueft
- id: fact-06
  type: fact
  big: 50 %
  text: der Stadtfläche sind Wald und Parks, sogar etwas mehr.
  source: https://www.wuppertal.de/microsite/CCC/Mediathek/Mediathek-Start.php.media/455146/Wirtschaftsstandort-Wuppertal-_web.pdf
  status: geprueft
- id: fact-07
  type: fact
  big: '1'
  text: 'weitere Bahn nach dem Schwebebahn-System Langen wurde je gebaut: die Bergschwebebahn in Dresden.'
  source: https://www.zfk.de/mobilitaet/oepnv/wuppertaler-schwebebahn-der-kaiserwagen-kehrt-zurueck
  status: geprueft
- id: fact-08
  type: fact
  big: '1975'
  text: kamen Dönberg, Dornap und Schöller zu Wuppertal.
  source: https://schwebebahn.de/cms/uploads/wsw_stadtrundgaenge_f5512fafd0.pdf
  status: geprueft
