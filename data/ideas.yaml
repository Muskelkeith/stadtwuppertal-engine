- id: fact-09
  type: fact
  big: 24.10.1900
  text: fuhr Kaiser Wilhelm II. mit der Schwebebahn von Döppersberg nach Vohwinkel, Monate vor der offiziellen Eröffnung.
  source: https://schwebebahn.de/cms/uploads/WSW_Schwebebahn_Flyer_Die_Geschichte_der_Wuppertaler_Schwebebahn_62a3bedfac.pdf
  status: geprueft
- id: fact-10
  type: fact
  big: 5.12.1898
  text: war die erste Probefahrt der Schwebebahn, über zwei Jahre vor dem Start.
  source: https://schwebebahn.de/cms/uploads/WSW_Schwebebahn_Flyer_Die_Geschichte_der_Wuppertaler_Schwebebahn_62a3bedfac.pdf
  status: geprueft
- id: fact-11
  type: fact
  big: Öl
  text: Der Ölberg heißt so, weil dort in den 1920ern noch Öllampen brannten, als die Viertel drumherum schon Strom hatten.
  source: https://de.wikipedia.org/wiki/Ölberg_(Wuppertal)
  status: pruefen
- id: fact-12
  type: fact
  big: '4.500'
  text: Baudenkmäler zählt Wuppertal.
  source: https://www.germany.travel/en/cities-culture/wuppertal.html
  status: pruefen
