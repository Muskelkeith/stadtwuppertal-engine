name: takt

# Alle 10 Minuten (Zeiten in UTC; die Engine rechnet selbst in Berliner Zeit und postet nur 6–23 Uhr).
on:
  schedule:
    - cron: "*/10 4-22 * * *"
  workflow_dispatch:
    inputs:
      befehl:
        description: "tick | check"
        default: tick

permissions:
  contents: write
  pages: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  takt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code --silent
      - name: Engine
        env:
          ENGINE_SECRETS: ${{ secrets.ENGINE_SECRETS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m engine ${{ inputs.befehl || 'tick' }}
      - name: Wochenbericht sichern (hält den Zeitplan am Leben)
        if: always()
        run: |
          git config user.name "stadtwuppertal-engine"
          git config user.email "engine@users.noreply.github.com"
          git add reports/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "wochenbericht" && git push)
