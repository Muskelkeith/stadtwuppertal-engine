name: takt

# Ein Dienst läuft knapp 6 Stunden und macht darin alle 10 Minuten einen Takt.
# Der Zeitplan startet stündlich einen neuen; läuft noch einer, wartet der neue (concurrency) und übernimmt danach.
# Die Engine rechnet selbst in Berliner Zeit und postet nur 6–23 Uhr.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      befehl:
        description: "dienst | tick | check"
        default: dienst

permissions:
  contents: write
  pages: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  takt:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Spracherkennungs-Modell zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo-v1
      - run: pip install -q -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code --silent
      - name: Engine
        env:
          ENGINE_SECRETS: ${{ secrets.ENGINE_SECRETS }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python -m engine ${{ inputs.befehl || 'dienst' }}
      - name: Rückfall nach misslungener Werkstatt-Reparatur
        if: always()
        run: |
          if [ -f .rollback ]; then
            git config user.name "stadtwuppertal-engine"
            git config user.email "engine@users.noreply.github.com"
            git pull -q --rebase origin main || git pull -q origin main
            git revert --no-edit "$(cat .rollback)" && git push -q
            rm -f .rollback
          fi
      - name: Wochenbericht sichern (hält den Zeitplan am Leben)
        if: always()
        run: |
          git config user.name "stadtwuppertal-engine"
          git config user.email "engine@users.noreply.github.com"
          git add reports/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "wochenbericht" && git push)
